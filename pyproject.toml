[project]
name = "github-developer-assisstant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "google>=3.0.0",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
github-developer-assisstant = "github_developer_assisstant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "mcp-client",
]
